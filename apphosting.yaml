runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://example.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_IN_APP_HOSTING
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_IN_APP_HOSTING
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_IN_APP_HOSTING
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REPLACE_IN_APP_HOSTING
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REPLACE_IN_APP_HOSTING
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_IN_APP_HOSTING
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
  - variable: STRIPE_PRICE_PLUS_MONTHLY
    secret: STRIPE_PRICE_PLUS_MONTHLY
  - variable: STRIPE_PRICE_PLUS_YEARLY
    secret: STRIPE_PRICE_PLUS_YEARLY
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
  - variable: OPENAI_LESSON_MODEL
    value: gpt-4.1-mini
    availability:
      - RUNTIME
  - variable: AI_PROVIDER
    value: OPENAI
    availability:
      - RUNTIME
